<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qipu MCVT · ATM RC</title><style>body{font:16px system-ui;margin:auto;max-width:860px;padding:24px;background:#f6f8fa;color:#162b3b}section{background:white;border:1px solid #d4dfe6;border-radius:12px;padding:18px;margin:16px 0}label{display:block;margin:8px 0}input,textarea,button{font:inherit;padding:9px;border:1px solid #a3b7c3;border-radius:6px;box-sizing:border-box}textarea{width:100%;font:14px monospace;min-height:80px}button{background:#123b50;color:white;margin:4px;cursor:pointer}pre{background:#eaf0f4;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#52616b}</style><h1>Qipu MCVT · ATM</h1><p>0.3.0-rc.1 · API mutable, IndexedDB, cola/CAS</p><section><label>Trayectoria <input id="id" value="Comercio"></label><button id="open">Abrir / génesis</button><button id="seed">Ejemplo inicial</button><button id="export">Exportar T120</button><small id="status"></small></section><section><h2>Conocer</h2><textarea id="path">[]</textarea><button id="read">Consultar</button><button id="meta">Metageometría</button><pre id="result"></pre></section><section><h2>Transformar</h2><label>Origen estable (nodo, índice)</label><input id="node" value="Demo"><input id="idx" type="number" min="0" value="100"><textarea id="q">["SET","Producto","SKU-A","Precio",35000]</textarea><button id="send">Preparar y anexar</button><button id="retry">Reenviar bytes conservados</button><pre id="receipt"></pre><small>No cambie el origen tras un resultado incierto. Laboratorio local, no autoridad pública.</small></section><script src="kernel.js"></script><script src="atm.js"></script><script>
const el=x=>document.getElementById(x),show=(x,v)=>el(x).textContent=JSON.stringify(v,null,2);let a;
const origin=()=>[el('node').value,Number(el('idx').value)];
function run(fn){return async()=>{try{await fn();el('status').textContent=' OK'}catch(e){el('status').textContent=' '+(e.code||e.name)+': '+e.message}}}
el('open').onclick=run(async()=>{if(a)a.close();a=await ATM.Local.open('qipu-atm-rc1',el('id').value);show('receipt',await a.init());show('result',await a.read([]))});
el('read').onclick=run(async()=>show('result',await a.read(JSON.parse(el('path').value))));el('meta').onclick=run(async()=>show('result',await a.read([])));
el('send').onclick=run(async()=>{show('receipt',await a.submit(JSON.parse(el('q').value),origin()));show('result',await a.read([]))});
el('retry').onclick=run(async()=>show('receipt',await a.retry(origin())));
el('seed').onclick=run(async()=>{if(!a)throw Error('Abra primero la trayectoria');let qs=[['DEF',['Producto'],[['Producto','Nombre','text',['SET'],true],['Producto','Precio','natural',['SET'],false],['Producto','Stock','natural',['SET','ADD','SUB'],false]],[]],['SET','Producto','SKU-A','Nombre','Camisa'],['SET','Producto','SKU-A','Precio',35000],['SET','Producto','SKU-A','Stock',20]];for(let i=0;i<qs.length;i++)await a.submit(qs[i],['Semilla',i]);show('result',await a.read([]))});
el('export').onclick=run(async()=>{const u=URL.createObjectURL(new Blob([await a.export()]));const x=document.createElement('a');x.href=u;x.download=a.id+'.qipu';x.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});
</script></html>
